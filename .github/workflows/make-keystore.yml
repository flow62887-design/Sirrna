name: make-keystore
# One-time: generates the Sirrna APK signing key inside your own repo.
# Run it, download the artifact, put the two values into repo secrets
# (KEYSTORE_B64 and KEYSTORE_PASS), keep sirrna.jks as a backup, then
# delete the artifact and the downloaded files. Nothing leaves GitHub.
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Generate keystore (alias "sirrna", RSA 2048, 10000 days)
        run: |
          PASS=$(cat /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/sirrna.jks" \
            -alias sirrna -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Sirrna, O=Sirrna, C=EG"
          mkdir -p out
          base64 -w0 "$RUNNER_TEMP/sirrna.jks" > out/keystore-b64.txt
          printf '%s' "$PASS" > out/keystore-pass.txt
          cp "$RUNNER_TEMP/sirrna.jks" out/sirrna.jks
          echo "keystore generated. sha256 of the jks:"
          sha256sum "$RUNNER_TEMP/sirrna.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: sirrna-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
