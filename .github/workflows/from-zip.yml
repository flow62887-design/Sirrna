name: from-zip
on: workflow_dispatch
env:
  FIND_ZIP: |
    ls -la sirrna-source-*.zip; Z=$(ls sirrna-source-*.zip | sort -V | tail -n1); echo "zip: $Z"
    rm -rf "$RUNNER_TEMP/s"; unzip -q "$Z" -d "$RUNNER_TEMP/s"
    A=$(find "$RUNNER_TEMP/s" -maxdepth 3 -name android-nearby-test -type d | head -n1)
    test -n "$A" || { echo "android-nearby-test not found in zip"; exit 1; }
    echo "ROOT=$(dirname "$A")" >> "$GITHUB_ENV"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: eval "$FIND_ZIP"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (preinstalled on the runner)
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SM" ] || SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1); echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Keystore (optional secret KEYSTORE_B64)
        env: { K: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          [ -n "$K" ] && echo "$K" | base64 -d > "$RUNNER_TEMP/k.jks" && echo "SIRRNA_KEYSTORE=$RUNNER_TEMP/k.jks" >> "$GITHUB_ENV" || echo "no keystore: temporary debug key"
      - name: Build DEMO then REAL
        env:
          SIRRNA_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cd "$ROOT/android-nearby-test"; echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$RUNNER_TEMP/o"
          gradle assembleDebug -Pdemo --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/o/sirrna-DEMO.apk"
          rm -f app/google-services.json
          [ -n "$GSJ" ] && printf '%s' "$GSJ" > app/google-services.json && echo "google-services.json added"
          gradle clean assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/o/sirrna.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: "${{ runner.temp }}/o/*.apk" }
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - run: eval "$FIND_ZIP"
      - uses: actions/download-artifact@v4
        with: { name: apks, path: apk }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd "$ROOT/emu" && npm init -y >/dev/null && npm i ws@8
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Write test script
        run: |
          cat > "$RUNNER_TEMP/run.sh" <<'EOS'
          cd "$GITHUB_WORKSPACE"; mkdir -p out
          echo "== smoke script has v15.3 fixes (reconnect count, 1 or more = yes): $(grep -c reconnect "$ROOT/emu/cdp-smoke.js")"
          adb install -r apk/sirrna-DEMO.apk
          echo "== webview:"; adb shell dumpsys package com.google.android.webview | grep versionName; adb shell dumpsys package com.android.webview | grep versionName
          adb logcat -c
          (cd "$ROOT/emu" && OUT="$GITHUB_WORKSPACE/out/shots" node cdp-smoke.js) 2>&1 | tee out/smoke.log
          R=${PIPESTATUS[0]}
          adb exec-out screencap -p > out/final.png
          echo "== screenshots:"; ls -la out/shots
          echo "== window state:"; adb shell dumpsys window | grep -E "mCurrentFocus|isKeyguardShowing|mScreenOn" | head
          adb logcat -d > out/logcat.txt
          echo "== logcat (webview/crash/app lines):"; grep -iE "chromium|webview|FATAL|AndroidRuntime|sirrna|ANR in|Console" out/logcat.txt | tail -60
          exit $R
          EOS
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.api == 27 && 'x86' || 'x86_64' }}
          profile: pixel_5
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ${{ runner.temp }}/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "emulator-api-${{ matrix.api }}", path: out }
